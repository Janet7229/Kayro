<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        #login, #logoutBtn {
            margin: 20px;
        }

        input, button {
            padding: 8px;
            font-size: 1em;
            margin: 5px;
        }

        .calendar-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 10px;
        }

        .calendar-block {
            border: 1px solid #ccc;
            padding: 10px;
            width: 300px;
        }

        .month-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-label, .day {
            padding: 10px 5px;
            border: 1px solid #ccc;
            font-size: 0.85em;
            min-height: 40px;
            word-wrap: break-word;
        }

        .day-label {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .day {
            background-color: #f9f9f9;
            cursor: pointer;
        }

        .highlight {
            background-color: #c2f0c2 !important;
            color: #000;
        }

        @media (max-width: 600px) {
            .calendar-block {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h2 id="header">Admin Calendar (Login Required)</h2>

    <div id="login">
        <input type="email" id="email" placeholder="Admin Email" />
        <input type="password" id="password" placeholder="Password" />
        <button id="loginBtnAction">Login</button>
    </div>

    <button id="logoutBtn" style="display:none;">Logout</button>
    <div id="calendarContainer" class="calendar-container" style="display:none;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, doc, setDoc, getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_5YgdpDfpa0dJtcfkUii_UjCKO9oF4J0",
            authDomain: "shamankingdata.firebaseapp.com",
            projectId: "shamankingdata",
            storageBucket: "shamankingdata.appspot.com",
            messagingSenderId: "757444066890",
            appId: "1:757444066890:web:e4f9d41e2905e588d930b3"
        };

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Configuration & Element Selection ---
        const adminEmail = "admin@example.com"; // <-- Set your admin email here
        const loginDiv = document.getElementById("login");
        const loginBtn = document.getElementById("loginBtnAction"); // Get button by new ID
        const logoutBtn = document.getElementById("logoutBtn");
        const calendarContainer = document.getElementById("calendarContainer");

        // --- Functions ---
        const login = async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert("Login failed: " + err.message);
            }
        };

        const logout = () => {
            signOut(auth);
        };
        
        // --- Attach Event Listeners (The Fix) ---
        loginBtn.addEventListener('click', login);
        logoutBtn.addEventListener('click', logout);

        // --- Authentication State Change Handler ---
        onAuthStateChanged(auth, async user => {
            if (user && user.email === adminEmail) {
                loginDiv.style.display = "none";
                logoutBtn.style.display = "inline-block";
                calendarContainer.style.display = "flex";
                document.getElementById("header").textContent = `Welcome, Admin!`;
                renderCalendars();
            } else {
                loginDiv.style.display = "block";
                logoutBtn.style.display = "none";
                calendarContainer.style.display = "none";
                document.getElementById("header").textContent = "Admin Calendar (Login Required)";
            }
        });

        // --- Calendar Rendering Logic ---
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        async function renderCalendars() {
            const now = new Date();
            const baseMonth = now.getMonth();
            const baseYear = now.getFullYear();
            calendarContainer.innerHTML = "";

            for (let offset = 0; offset < 7; offset++) {
                const date = new Date(baseYear, baseMonth + offset, 1);
                const month = date.getMonth();
                const year = date.getFullYear();
                const docId = `${year}-${String(month + 1).padStart(2, '0')}`;

                const saved = await getDoc(doc(db, "calendars", docId));
                const savedData = saved.exists() ? saved.data() : {};

                const block = document.createElement('div');
                block.className = 'calendar-block';

                const title = document.createElement('div');
                title.className = 'month-title';
                title.textContent = `${monthNames[month]} ${year}`;
                block.appendChild(title);

                const cal = document.createElement('div');
                cal.className = 'calendar';

                const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                for (let d of days) {
                    const label = document.createElement('div');
                    label.className = 'day-label';
                    label.textContent = d;
                    cal.appendChild(label);
                }

                const firstDay = new Date(year, month, 1).getDay();
                const numDays = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    cal.appendChild(document.createElement('div'));
                }

                for (let d = 1; d <= numDays; d++) {
                    const day = document.createElement('div');
                    day.className = 'day';
                    const key = `d${d}`;
                    day.textContent = savedData[key] || d;

                    if (savedData[key]) {
                        day.classList.add('highlight');
                    }

                    day.addEventListener('click', async () => {
                        const input = prompt(`Edit note for ${monthNames[month]} ${d}:`, savedData[key] || '');
                        if (input !== null) {
                            day.textContent = input || d;
                            if (input) {
                                day.classList.add('highlight');
                                savedData[key] = input;
                            } else {
                                day.classList.remove('highlight');
                                delete savedData[key];
                            }
                            await setDoc(doc(db, "calendars", docId), savedData, { merge: true });
                        }
                    });
                    cal.appendChild(day);
                }
                block.appendChild(cal);
                calendarContainer.appendChild(block);
            }
        }
    </script>
</body>
</html>
