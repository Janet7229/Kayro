<!DOCTYPE html>
<html>
<head>
  <title>Editable Calendar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      max-width: 300px;
      margin: auto;
    }
    .day {
      padding: 20px;
      border: 1px solid #ccc;
      cursor: pointer;
      background-color: #f9f9f9;
      transition: background-color 0.3s;
    }
    .day:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h2>Editable Calendar</h2>
  <div class="calendar" id="calendar"></div>

  <script>
    const calendar = document.getElementById('calendar');

    // Generate calendar for 30 days
    for (let i = 1; i <= 30; i++) {
      const day = document.createElement('div');
      day.className = 'day';
      day.textContent = i;
      
      day.addEventListener('click', function() {
        const input = prompt("Enter letter or number:");
        if (input !== null && input !== "") {
          day.textContent = input;
          day.style.backgroundColor = '#ffdb99'; // highlight color
        }
      });

      calendar.appendChild(day);
    }
  </script>
</body>
</html>
